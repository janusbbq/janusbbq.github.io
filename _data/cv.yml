  summary: >-
    Graduate Electrical Engineering student at UT Knoxville with eight years at a State Grid utility as a Substation Maintenance Technician
    (2010–2012) and Electronic Information Technician (2012–2018), spanning 35–110kV substation construction and commissioning, distribution
    automation, distribution network planning, and reliability performance evaluation. Electrical Engineer professional title (2016). Current research covers
    power-system simulation automation, transmission analytics, voltage stability, and verification of AI-generated grid analyses.

