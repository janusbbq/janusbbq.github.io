  sections:
    Research Interests:
      - name: AI-enabled power-system analysis
        summary: Large language model agents, automated modeling workflows, and decision-support tools for grid studies.
        highlights:
          - Power-system automation
          - Engineering workflow agents
          - Interpretable analysis tools

      - name: Stability, optimization, and resilience
        summary: Methods for voltage stability assessment, optimization-based analysis, and resilient operation of modern power networks.
        highlights:
          - PV and QV curve analysis
          - Weak-grid diagnosis
          - Resilience-oriented planning and operation

    Experience:
      - company: State Grid Corporation of China
        position: Power Systems Engineering Experience
        location: China
        summary: Worked close to practical grid operation and planning problems, motivating research on usable analytical tools for power-system engineers.
        highlights:
          - Power-system operation and planning context
          - Grid-analysis workflows
          - Practical engineering constraints

    Projects:
      - name: LLM for Automated Modeling and Analysis in Power Systems
        summary: A research direction exploring how large language model agents can assist with power-system modeling, study setup, result interpretation, and reproducible analysis.
        highlights:
          - Automated study preparation
          - Model-aware reasoning
          - Engineer-facing explanations

      - name: PV Curve Agent
        summary: An interactive assistant for voltage stability studies, PV curve interpretation, and weak-bus or weak-area diagnosis.
        highlights:
          - Voltage stability assessment
          - PV curve workflow support
          - Transparent analysis outputs

    Publications:
      - title: AI-Enabled Voltage Stability Assessment and Power-System Analysis
        authors:
